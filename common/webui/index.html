<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>esp32p4-cam</title>
<style>
 :root{color-scheme:dark light;--bg:#14161a;--fg:#e8e8ea;--mut:#8b8f98;--card:#1d2026;--acc:#4da3ff;--ok:#4cc38a;--bad:#ff6b6b}
 @media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--fg:#1b1d22;--mut:#667;--card:#fff;--acc:#1a73e8;--ok:#1e8e5a;--bad:#d33}}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
 main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
 @media(max-width:860px){main{grid-template-columns:1fr}}
 .card{background:var(--card);border-radius:10px;padding:12px}
 #view{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;display:block;object-fit:contain}
 label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
 input,select{width:100%;padding:7px;border-radius:6px;border:1px solid #0003;background:var(--bg);color:var(--fg);font:inherit}
 input[type=range]{padding:0}
 button#shot{width:100%;margin-top:0;padding:16px;font-size:18px;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
 button#shot:disabled{opacity:.6;cursor:wait}
 #msg{margin-top:8px;min-height:2.6em;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
 #gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
 #gal a{display:block}#gal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block}
 h2{font-size:13px;margin:14px 0 0;color:var(--mut);font-weight:600}
 .hint{color:var(--mut);font-size:12px;margin-top:6px}
 #ctl{margin-top:14px;border-top:1px solid #8884;padding-top:4px}
 #ctl.off{opacity:.45;pointer-events:none}
 .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
 .row h3{font-size:13px;margin:0;font-weight:600}
 .val{font-variant-numeric:tabular-nums;color:var(--fg)}
 .sw{display:inline-flex;border:1px solid #8886;border-radius:7px;overflow:hidden}
 .sw button{border:0;background:transparent;color:var(--mut);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
 .sw button.on{background:var(--acc);color:#fff}
 .chk{display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--mut);font-size:12px}
 .chk input{width:auto}
 input[type=range]:disabled{opacity:.4}
 .af{display:flex;align-items:center;gap:8px;margin-top:8px}
 .af button{padding:5px 14px;border:1px solid var(--acc);border-radius:7px;background:transparent;color:var(--acc);font:inherit;cursor:pointer}
 .af button:disabled{opacity:.5;cursor:wait}
 #cmsg{min-height:1.4em;font-size:12px;margin-top:6px}
 .pv{position:relative}
 #wbbox{position:absolute;left:37.5%;top:37.5%;width:25%;height:25%;border:1px dashed #fff8;pointer-events:none;display:none}
 #lt{margin-top:14px;border-top:1px solid #8884;padding-top:4px}
 #lt .sw button:disabled{opacity:.4;cursor:default}
 #pre{margin-top:14px;border-top:1px solid #8884;padding-top:4px}
 .pbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
 .pbtns button{padding:4px 10px;border:1px solid #8886;border-radius:7px;background:transparent;color:var(--fg);font:inherit;font-size:12px;cursor:pointer}
 .pbtns button:disabled{opacity:.4;cursor:default}
 #pmod{color:var(--bad);font-size:12px}
 #reset{color:var(--mut);font-size:11px;background:none;border:0;padding:0;margin-top:8px;cursor:pointer;text-decoration:underline}
</style>
<main>
 <section class="card">
  <div class="pv"><img id="view" alt="preview"><div id="wbbox" title="白を合わせる範囲"></div></div>
  <div class="hint" id="pinfo"></div>
 </section>
 <aside class="card">
  <button id="shot">シャッター (Space)</button>
  <div id="msg"></div>
  <label for="n">プレビューのサイズ</label>
  <select id="n"><option value="4">480×264</option><option value="8" selected>960×536</option>
   <option value="12">1440×792</option><option value="16">1920×1080</option></select>
  <label for="pq">プレビューの画質 <span id="pqv"></span></label>
  <input id="pq" type="range" min="10" max="95" value="50">
  <div id="pre" style="display:none">
   <div class="row"><h3>プリセット (試験片ごとの設定)</h3><span id="pmod"></span></div>
   <select id="preset"></select>
   <div class="pbtns"><button id="psave" title="今の設定を、選んでいるプリセットに上書きする">上書き保存</button>
    <button id="psaveas">名前を付けて保存</button><button id="pren">名前変更</button><button id="pdel">削除</button></div>
   <div class="hint">露出・ゲイン・ピント・WB・向き・撮影の画質と照明を保存します。プレビューのサイズと画質は含みません。</div>
  </div>
  <div id="lt">
   <div class="row"><h3>照明</h3>
    <span class="sw" id="ltsw"><button data-v="on" disabled>ON</button><button data-v="off" disabled>OFF</button></span></div>
   <div class="hint" id="ltv">照明の状態を読んでいます…</div>
  </div>
  <div id="ctl" class="off">
   <div class="row"><h3>露出</h3>
    <span class="sw" id="expsw"><button data-v="auto">Auto</button><button data-v="manual">Manual</button></span></div>
   <label for="exp">シャッター <span class="val" id="expv">–</span></label>
   <input id="exp" type="range" min="0" max="1000" value="500">
   <div class="row" style="margin-top:8px"><label for="gain" style="margin:0">明るさ (ゲイン) <span class="val" id="gainv">–</span></label>
    <label class="chk" title="シャッター優先: 明るさを自動で合わせる"><input id="gauto" type="checkbox" checked>自動</label></div>
   <input id="gain" type="range" min="0" max="46" value="0">
   <div class="row"><h3>ピント</h3>
    <span class="sw" id="focsw"><button data-v="auto">Auto</button><button data-v="manual">Manual</button></span></div>
   <label for="foc">位置 <span class="val" id="focv">–</span> <span style="font-size:11px">(大きいほど近く)</span></label>
   <input id="foc" type="range" min="0" max="1023" value="512">
   <div class="af"><button id="afbtn">AF</button><span class="hint" id="afv" style="margin:0"></span></div>
   <div id="wbsec">
   <div class="row"><h3>ホワイトバランス</h3>
    <span class="sw" id="wbsw"><button data-v="auto">Auto</button><button data-v="manual">Manual</button></span></div>
   <label for="wbr">赤 <span class="val" id="wbrv">–</span></label>
   <input id="wbr" type="range" min="300" max="3999" value="1500">
   <label for="wbb">青 <span class="val" id="wbbv">–</span></label>
   <input id="wbb" type="range" min="300" max="3999" value="1500">
   <div class="af"><button id="wbbtn" title="白い紙などを点線の枠に写して押す">白を合わせる</button><span class="hint" id="wbv" style="margin:0"></span></div>
   </div>
   <div class="row"><h3>撮影</h3>
    <label class="chk" title="シャッター (画面・物理ボタン) で照明を点けて撮る"><input id="slight" type="checkbox" checked>照明を点けて撮る</label></div>
   <label for="sq">画質 <span class="val" id="sqv">–</span></label>
   <input id="sq" type="range" min="10" max="100" value="95">
   <div class="row" id="orirow"><h3>向き</h3>
    <span style="display:inline-flex;gap:10px"><label class="chk"><input id="hflip" type="checkbox">左右反転</label>
     <label class="chk"><input id="vflip" type="checkbox">上下反転</label></span></div>
   <div id="cmsg"></div>
   <button id="reset">設定をリセット</button>
  </div>
  <h2>撮影した写真 <span style="font-weight:400">(クリックで保存)</span></h2><div id="gal"></div>
 </aside>
</main>
<script>
const $=id=>document.getElementById(id), LS=window.localStorage||{};
const get=(k,d)=>{try{return LS.getItem(k)??d}catch(e){return d}}, put=(k,v)=>{try{LS.setItem(k,v)}catch(e){}};
$('n').value=get('n','8'); $('pq').value=get('pq','50');
// プレビューは別ポート (:81) の MJPEG。この画面はボード自身が配信しているので、アドレスは location から。
// 別の中継 (USB ブリッジなど) が同じ画面を配信する場合は、window.STREAM_URL で上書きできる。
function previewUrl(){
  const base=window.STREAM_URL||`http://${location.hostname}:81/stream.mjpg`;
  return `${base}?q=${$('pq').value}&n=${$('n').value}`;
}
function startPreview(){
  ['n','pq'].forEach(k=>put(k,$(k).value));
  $('pqv').textContent=$('pq').value;
  $('view').src=previewUrl(); $('pinfo').textContent='プレビュー中';
}
$('view').onerror=()=>{$('pinfo').textContent='プレビューに接続できません(この端末とボードが同じネットワークか確認)'};
['n','pq'].forEach(k=>$(k).addEventListener('change',startPreview));
$('pq').addEventListener('input',()=>$('pqv').textContent=$('pq').value);
let busy=false;
const stamp=d=>d.toISOString().replace(/[:.]/g,'-').slice(0,19);   // 写真のファイル名 (UTC)
// 物理ボタンと同じ撮影 (POST /shot): ボードが照明を点け、明るさが落ち着いてから撮って消す。
// 照明を画面のスイッチで点けたままなら、そのまま撮る。撮った写真はボードに貯まるので取りに行く。
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 画質と照明はボードの設定 (撮影の欄、プリセットに含まれる) を使う。
async function takeShot(){
  const r=await fetch('/shot',{method:'POST'});
  if(r.status===404)return null;                      // /shot の無い古いファーム
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||r.status+' '+r.statusText);
  $('msg').textContent='撮影中… (照明)';
  for(const t0=Date.now();;){
    const info=await api('GET','/shot/info');
    if(info.done>=j.id){
      const s=info.shots.find(s=>s.id===j.id);
      if(!s)throw new Error('写真が残っていません');
      const p=await fetch(`/shot.jpg?id=${j.id}`);
      if(!p.ok)throw new Error(p.status+' '+p.statusText);
      return {blob:await p.blob(),light:s.light};
    }
    if(Date.now()-t0>20000)throw new Error('撮影が終わりません');
    await sleep(250);
  }
}
async function shutter(){
  if(busy)return; busy=true; $('shot').disabled=true; $('msg').className=''; $('msg').textContent='撮影中…';
  $('view').removeAttribute('src');   // プレビューを止めて、静止画に帯域を譲る
  try{
    const t0=performance.now();
    let shot=await takeShot();
    if(!shot){
      const r=await fetch(`/snapshot.jpg?q=${$('sq').value}`);
      if(!r.ok)throw new Error(r.status+' '+r.statusText);
      shot={blob:await r.blob(),light:false};
    }
    const blob=shot.blob;
    const sec=((performance.now()-t0)/1000).toFixed(1);
    const name=stamp(new Date())+'.jpg';
    shots.unshift({name,url:URL.createObjectURL(blob)});
    if(shots.length>12)URL.revokeObjectURL(shots.pop().url);
    $('msg').className='ok';
    $('msg').textContent=`${name}  ${(blob.size/1000).toFixed(0)} kB  ${sec} 秒${shot.light?'':'  (照明なし)'}`;
    renderGallery();
  }catch(e){$('msg').className='bad';$('msg').textContent='失敗: '+e.message}
  busy=false; $('shot').disabled=false; startPreview();
}
$('shot').onclick=shutter;

// ---- 露出・ピントの操作 (ボードの /ctrl を直接呼ぶ) ----
async function api(method,path,params){
  const qs=new URLSearchParams(params||{}).toString();
  const r=await fetch(`${path}${qs?'?'+qs:''}`,{method});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||j.detail||r.statusText);
  return j;
}
let caps=null, st=null, touched={}, afBusy=false;
let flipping=false;   // 向きを変えてボードの再起動を待っている間 true
const touch=k=>touched[k]=Date.now(), fresh=k=>Date.now()-(touched[k]||0)<1500;
// シャッターは対数目盛り: スライダ 0..1000 <-> min..max µs
const s2us=v=>Math.round(caps.exposure_us.min*Math.pow(caps.exposure_us.max/caps.exposure_us.min,v/1000));
const us2s=us=>Math.round(1000*Math.log(us/caps.exposure_us.min)/Math.log(caps.exposure_us.max/caps.exposure_us.min));
function fmtShutter(us){const x=1e6/us; return `1/${x>=10?Math.round(x):x.toFixed(1)} s (${us} µs)`}
function setSw(id,v){for(const b of $(id).children)b.classList.toggle('on',b.dataset.v===v)}
function cmsg(t,cls){$('cmsg').className=cls||'';$('cmsg').textContent=t}

async function loadCaps(){
  caps=null; $('ctl').classList.add('off');
  try{ caps=await api('GET','/ctrl/caps'); }
  catch(e){ cmsg('ボードが制御 API に対応していません (ファームウェアを確認してください)','bad'); return }
  $('gain').min=caps.gain.min; $('gain').max=caps.gain.max;
  $('foc').min=caps.focus.min; $('foc').max=caps.focus.max;
  $('wbsec').style.display=caps.wb?'':'none'; $('wbbox').style.display=caps.wb?'block':'none';
  if(caps.wb){ for(const id of ['wbr','wbb']){$(id).min=caps.wb.min; $(id).max=caps.wb.max} }
  $('ctl').classList.remove('off'); cmsg('');
  poll();
}
function render(s){
  st=s;
  const em=s.exposure_mode==='manual', ga=s.gain_mode==='auto', fm=s.focus_mode==='manual';
  setSw('expsw',s.exposure_mode); setSw('focsw',s.focus_mode);
  $('gauto').checked=ga; $('gauto').disabled=!em;
  $('exp').disabled=!em; $('gain').disabled=!em||ga; $('foc').disabled=!fm;
  // 自分が今動かしているスライダは、ボードの値で上書きしない
  if(!fresh('exp'))$('exp').value=us2s(Math.max(s.exposure_us,caps.exposure_us.min));
  if(!fresh('gain'))$('gain').value=s.gain_index;
  if(!fresh('foc'))$('foc').value=s.focus_pos;
  $('expv').textContent=fmtShutter(fresh('exp')?s2us(+$('exp').value):s.exposure_us);
  const gi=fresh('gain')?+$('gain').value:s.gain_index;
  $('gainv').textContent='×'+(caps.gain.x[gi-caps.gain.min]??s.gain_x).toFixed(2);
  $('focv').textContent=fresh('foc')?$('foc').value:s.focus_pos;
  if(caps.wb){
    const wm=s.wb_mode==='manual', wbBusy=s.wb_state==='running';
    setSw('wbsw',s.wb_mode); $('wbr').disabled=$('wbb').disabled=!wm;
    if(!fresh('wbr'))$('wbr').value=s.wb_red; if(!fresh('wbb'))$('wbb').value=s.wb_blue;
    $('wbrv').textContent='×'+((fresh('wbr')?+$('wbr').value:s.wb_red)/1000).toFixed(2);
    $('wbbv').textContent='×'+((fresh('wbb')?+$('wbb').value:s.wb_blue)/1000).toFixed(2);
    $('wbbtn').disabled=wbBusy;
    $('wbv').textContent=wbBusy?'合わせています…':s.wb_state==='done'?'白を合わせました':s.wb_state==='failed'?'合わせられませんでした (枠に白いものを写して再試行)':'';
  }
  if('shot_q' in s){
    if(!fresh('sq'))$('sq').value=s.shot_q;
    $('sqv').textContent=fresh('sq')?$('sq').value:s.shot_q;
    $('slight').checked=!!s.shot_light;
  }
  renderPresetState(s);
  // 向き: 古いファームは hflip を返さないので行ごと隠す。再起動待ちの間は表示を変えない
  $('orirow').style.display=('hflip' in s)?'':'none';
  if(!flipping){ $('hflip').checked=!!s.hflip; $('vflip').checked=!!s.vflip }
  afBusy=s.af_state==='running';
  $('afbtn').disabled=afBusy; if(!busy)$('shot').disabled=afBusy;
  $('afv').textContent=afBusy?'合焦中…':s.af_state==='done'?`合焦 ${s.focus_pos} (${(s.af_ms/1000).toFixed(1)} s)`
    :s.af_state==='failed'?'AF 中断':'';
}
let pollTimer=null;
async function poll(){
  clearTimeout(pollTimer);
  if(!caps||flipping)return;
  try{ render(await api('GET','/ctrl')); if(/接続/.test($('cmsg').textContent))cmsg(''); }
  catch(e){ if(!flipping)cmsg('ボードの状態を読めません: '+e.message,'bad') }
  if(!flipping)pollTimer=setTimeout(poll,afBusy?300:1000);
}
// 送信は 150ms 以上空けて、最新の値だけを送る
let pending=null, inflight=false, lastSent=0, sendTimer=null;
function send(p){ pending=Object.assign(pending||{},p); pump() }
async function pump(){
  if(inflight||!pending)return;
  const wait=150-(Date.now()-lastSent);
  if(wait>0){ if(!sendTimer)sendTimer=setTimeout(()=>{sendTimer=null;pump()},wait); return }
  const p=pending; pending=null; inflight=true; lastSent=Date.now();
  try{ render(await api('POST','/ctrl',p)); }catch(e){ cmsg('設定できません: '+e.message,'bad') }
  inflight=false; pump();
}
// クリック後にフォーカスを外す: 残ると Space (シャッター) でもう一度押されてしまう
for(const [id,key] of [['expsw','exposure_mode'],['focsw','focus_mode'],['wbsw','wb_mode']])
  for(const b of $(id).children)b.onclick=()=>{b.blur(); send({[key]:b.dataset.v})};
$('gauto').onchange=()=>send({gain_mode:$('gauto').checked?'auto':'manual'});
function slider(id,fn){
  const h=()=>{touch(id); const p=fn(); if(st)render(st); send(p)};
  $(id).addEventListener('input',h); $(id).addEventListener('change',h);
}
slider('exp',()=>({exposure_us:s2us(+$('exp').value)}));
slider('gain',()=>({gain_index:+$('gain').value}));
slider('foc',()=>({focus_pos:+$('foc').value}));
slider('wbr',()=>({wb_red:+$('wbr').value}));
slider('wbb',()=>({wb_blue:+$('wbb').value}));
slider('sq',()=>({shot_q:+$('sq').value}));
$('slight').onchange=()=>{$('slight').blur(); send({shot_light:$('slight').checked?1:0})};
$('wbbtn').onclick=async()=>{
  $('wbbtn').blur();
  try{ await api('POST','/wb/onepush'); $('wbbtn').disabled=true; $('wbv').textContent='合わせています…'; setTimeout(poll,300) }
  catch(e){ cmsg('白を合わせられません: '+e.message,'bad') }
};
$('afbtn').onclick=async()=>{
  $('afbtn').blur();
  try{ await api('POST','/af'); afBusy=true; $('afbtn').disabled=true; $('afv').textContent='合焦中…'; poll() }
  catch(e){ cmsg('AF を開始できません: '+e.message,'bad') }
};
// ---- 照明 (ボードの /io)。どの出力が照明かはボード側 (pins.h の LIGHT_MASK) が決める ----
// ON にしたままシャッターを押すと、照明は点いたまま撮る (撮影後も消えない)。
let ltTimer=null;
function renderLight(j){
  const ok=!!j.present;
  for(const b of $('ltsw').children)b.disabled=!ok;
  setSw('ltsw',ok?(j.light?'on':'off'):'');
  $('ltv').className='hint'+(ok?'':' bad');
  $('ltv').textContent=ok?(j.light?'点灯中 (撮影しても点いたまま)':st&&st.shot_light===false?'消灯中 (撮影でも点けない設定)':'消灯中 (撮影の間だけ点く)'):'照明ボード (MCP23017) が見つかりません';
}
async function pollLight(){
  clearTimeout(ltTimer);
  try{ renderLight(await api('GET','/io')) }
  catch(e){ $('ltv').className='hint bad'; $('ltv').textContent='照明の状態を読めません: '+e.message }
  ltTimer=setTimeout(pollLight,2000);
}
for(const b of $('ltsw').children)b.onclick=async()=>{
  b.blur();
  try{ renderLight(await api('POST','/io',{light:b.dataset.v==='on'?1:0})) }
  catch(e){ $('ltv').className='hint bad'; $('ltv').textContent='照明を切り替えられません: '+e.message }
};
// ---- 向き (センサーで反転)。ボードは設定を保存して再起動し、起動時に反映する ----
async function setFlip(key){
  const el=$(key); el.blur();
  if(!confirm('向きの変更は、ボードの再起動で反映します（数秒かかります）。変更しますか?')){el.checked=!el.checked;return}
  try{ await api('POST','/ctrl',{[key]:el.checked?1:0}) }
  catch(e){ el.checked=!el.checked; cmsg('向きを変えられません: '+e.message,'bad'); return }
  flipping=true; clearTimeout(pollTimer); $('view').removeAttribute('src');
  $('ctl').classList.add('off'); cmsg('ボードを再起動しています…','ok');
  await waitBoard();
  flipping=false; startPreview(); loadCaps();
}
// 再起動が始まるのを待ってから (約 1 秒後)、応答が戻るまで 2 秒おきに確かめる
async function waitBoard(){
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{ await api('GET','/ctrl/caps'); return }catch(e){}
  }
}
$('hflip').onchange=()=>setFlip('hflip');
$('vflip').onchange=()=>setFlip('vflip');
$('reset').onclick=async()=>{
  if(!confirm('露出・ピント・ホワイトバランス・向き・撮影の設定を消して、Auto と既定値に戻しますか? (プリセットは消えません)'))return;
  const wasFlipped=st&&(st.hflip||st.vflip);
  try{ render(await api('POST','/config/reset')); cmsg('設定をリセットしました','ok') }
  catch(e){ cmsg('リセットできません: '+e.message,'bad'); return }
  if(wasFlipped){   // 向きも戻すので、ボードが再起動する
    flipping=true; clearTimeout(pollTimer); $('view').removeAttribute('src');
    $('ctl').classList.add('off'); cmsg('向きを戻すため、ボードを再起動しています…','ok');
    await waitBoard(); flipping=false; startPreview(); loadCaps();
  }
};
// ---- プリセット (ボードに保存。/presets) ----
// 選ぶとその設定を読み込む。向きが違うプリセットはボードの再起動で反映する。
let presets=[], presetBusy=false;
function renderPresets(){
  const sel=$('preset'), act=st&&st.preset;
  sel.innerHTML='<option value="">(プリセットなし)</option>'+presets.map(p=>{
    const n=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    return `<option value="${n}">${n}</option>`}).join('');
  sel.value=act&&presets.some(p=>p.name===act)?act:'';
  renderPresetState(st);
}
function renderPresetState(s){
  if(!s||!('preset' in s))return;
  const act=s.preset, known=act&&presets.some(p=>p.name===act);
  if(act&&!known&&!presetBusy){loadPresets();return}   // 他の画面で作られた
  if(document.activeElement!==$('preset'))$('preset').value=known?act:'';
  $('pmod').textContent=act&&s.preset_modified?'変更あり (未保存)':'';
  $('psave').disabled=$('pren').disabled=$('pdel').disabled=!known||presetBusy;
}
let presetsLoading=false;
async function loadPresets(){
  if(presetsLoading)return; presetsLoading=true;
  try{ const j=await api('GET','/presets'); presets=j.presets; $('pre').style.display=''; renderPresets() }
  catch(e){ $('pre').style.display='none' }   // 古いファーム
  presetsLoading=false;
}
async function presetOp(fn,okMsg){
  presetBusy=true; renderPresetState(st);
  try{ const j=await fn(); if(j&&j.presets)presets=j.presets; await poll(); renderPresets(); if(okMsg)cmsg(okMsg,'ok') }
  catch(e){ cmsg('プリセット: '+e.message,'bad'); renderPresets() }
  presetBusy=false; renderPresetState(st);
}
$('preset').onchange=async()=>{
  const sel=$('preset'), name=sel.value; sel.blur();
  if(!name){ renderPresets(); return }        // 「なし」は選ぶだけでは何も変えない
  if(st&&st.preset_modified&&!confirm(`「${st.preset}」の変更は保存されていません。「${name}」を読み込みますか?`)){renderPresets();return}
  const p=presets.find(p=>p.name===name);
  const reorient=p&&st&&(('hflip' in p&&p.hflip!==st.hflip)||('vflip' in p&&p.vflip!==st.vflip));
  if(reorient&&!confirm(`「${name}」は向きが違うため、ボードを再起動して反映します（数秒かかります）。読み込みますか?`)){renderPresets();return}
  if(!reorient){ await presetOp(()=>api('POST','/presets/load',{name}),`「${name}」を読み込みました`); return }
  try{ await api('POST','/presets/load',{name}) }catch(e){ cmsg('プリセット: '+e.message,'bad'); renderPresets(); return }
  flipping=true; clearTimeout(pollTimer); $('view').removeAttribute('src');
  $('ctl').classList.add('off'); cmsg(`「${name}」の向きにするため、ボードを再起動しています…`,'ok');
  await waitBoard(); flipping=false; startPreview(); await loadCaps(); loadPresets();
};
$('psave').onclick=()=>{
  $('psave').blur(); const name=st&&st.preset; if(!name)return;
  if(!confirm(`今の設定で「${name}」を上書きしますか?`))return;
  presetOp(()=>api('POST','/presets/save',{name}),`「${name}」に保存しました`);
};
$('psaveas').onclick=()=>{
  $('psaveas').blur();
  const name=(prompt('プリセットの名前 (試験片の種類など)',st&&st.preset||'')||'').trim(); if(!name)return;
  if(presets.some(p=>p.name===name)&&!confirm(`「${name}」はもうあります。上書きしますか?`))return;
  presetOp(()=>api('POST','/presets/save',{name}),`「${name}」として保存しました`);
};
$('pren').onclick=()=>{
  $('pren').blur(); const name=st&&st.preset; if(!name)return;
  const to=(prompt(`「${name}」の新しい名前`,name)||'').trim(); if(!to||to===name)return;
  presetOp(()=>api('POST','/presets/rename',{name,to}),`「${to}」に名前を変えました`);
};
$('pdel').onclick=()=>{
  $('pdel').blur(); const name=st&&st.preset; if(!name)return;
  if(!confirm(`プリセット「${name}」を削除しますか? (今の設定はそのまま)`))return;
  presetOp(()=>api('POST','/presets/delete',{name}),`「${name}」を削除しました`);
};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();shutter()}});
const shots=[];   // この画面で撮った写真 (ブラウザのメモリ上。ページを閉じると消える)
function renderGallery(){
  $('gal').innerHTML=shots.map(s=>`<a href="${s.url}" download="${s.name}" title="${s.name} (クリックで保存)"><img src="${s.url}"></a>`).join('');
}
// ---- 物理ボタンで撮った写真 ----
// ボタンはボードが照明を点けて撮り、ボードに最新 4 枚まで貯める (/shot/info, /shot.jpg)。
// 開いている画面がそれを見張り、新しい写真を取り込んで上の一覧に加える。
// 画面を開く前から貯まっていた写真は取り込まない。ボードが再起動したら (boot が変わる)、
// その後の写真はすべて新しい。
let shotBoot=null, shotSeen=0;
async function pollShots(){
  try{
    const info=await api('GET','/shot/info');
    if(info.boot!==shotBoot){ shotSeen=shotBoot===null?info.done:0; shotBoot=info.boot }
    for(const s of info.shots){
      if(s.id<=shotSeen)continue;
      shotSeen=s.id;
      if(s.src!=='button')continue;            // 画面のシャッター (/shot) の分は shutter() が取り込む
      const r=await fetch(`/shot.jpg?id=${s.id}`);
      if(!r.ok)continue;                       // 取り込む前にリングから押し出された
      const blob=await r.blob();
      const name=stamp(new Date(Date.now()-s.age_ms))+'-button.jpg';
      shots.unshift({name,url:URL.createObjectURL(blob)});
      if(shots.length>12)URL.revokeObjectURL(shots.pop().url);
      renderGallery();
      $('msg').className='ok';
      $('msg').textContent=`ボタンで撮影: ${name}  ${(blob.size/1000).toFixed(0)} kB${s.light?'':'  (照明なし)'}`;
    }
  }catch(e){}   // 古いファームやボードの再起動中は黙って次を待つ
  setTimeout(pollShots,1500);
}
startPreview(); loadCaps(); loadPresets(); pollLight(); pollShots();
</script></html>
