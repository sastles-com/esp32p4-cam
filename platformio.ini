; ESP32-P4-WIFI6-M + Raspberry Pi Camera Module 3 (IMX708)
; 撮影 → Wi-Fi経由でPCへ送信 / MQTT・HTTP(FastAPI)で制御
;
; 注意:
; - 公式 platformio/espressif32 は ESP32-P4 非対応。pioarduino フォークを使う。
; - フレームワークは ESP-IDF。IMX708ドライバ(esp_cam_sensor_imx)が IDF コンポーネントのため。
; - 依存コンポーネントは src/idf_component.yml で ESP Component Registry から取得される。
; - sdkconfig.defaults がプロジェクトルートにあれば自動で読み込まれる。

[platformio]
default_envs = esp32-p4-wifi6-m

[env:esp32-p4-wifi6-m]
; 動作確認できたら "stable" ではなく具体的なリリース番号に固定すること
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = espidf

; ボードは 32MB NOR Flash 搭載。汎用 esp32-p4 ボード定義は 4MB なので上書きする
board_upload.flash_size = 32MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
