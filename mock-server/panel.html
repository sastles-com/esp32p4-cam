<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Board Panel</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --mut:#6b6b66; --card:#fff; --line:#ddd; --acc:#c4501a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1a; --fg:#ecece8; --mut:#9a9a94; --card:#262624; --line:#3a3a37; --acc:#ef7b45; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width:560px; margin:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 16px; font-size:13px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  h2 { font-size:13px; color:var(--mut); margin:0 0 8px; font-weight:600; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line);
           background:var(--card); color:var(--fg); cursor:pointer; margin:0 6px 6px 0; }
  button.main { background:var(--acc); border-color:var(--acc); color:#fff; }
  label { display:flex; align-items:center; gap:8px; margin:4px 0; }
  pre { margin:0; font-size:12px; white-space:pre-wrap; word-break:break-all; color:var(--mut); }
  a { color:var(--acc); }
</style>
</head>
<body>
<main>
  <h1>ダミーボードの操作</h1>
  <p class="sub">実機には無い操作です。カメラ画面は <a href="/" target="_blank">/</a> で開けます。</p>

  <section>
    <h2>操作</h2>
    <button class="main" id="btn">物理ボタンを押す</button>
    <button id="reboot">ボードを再起動</button>
    <label><input type="checkbox" id="unplugged"> USB を抜く（ボードの API が 503 になる）</label>
    <pre id="msg"></pre>
  </section>

  <section>
    <h2>ボードの構成</h2>
    <label><input type="checkbox" id="camera"> カメラあり</label>
    <label><input type="checkbox" id="light_board"> 照明ボード（MCP23017）あり</label>
    <label><input type="checkbox" id="slow"> シリアルの遅さを真似る（約 200 kB/s）</label>
  </section>

  <section>
    <h2>状態</h2>
    <pre id="state">…</pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
async function call(method, path) {
  const r = await fetch(path, { method });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}
async function refresh() {
  try {
    const s = (await call('GET', '/_mock/state')).j;
    for (const k of ['camera', 'light_board', 'slow', 'unplugged']) $(k).checked = s[k];
    const info = (await call('GET', '/shot/info')).j;
    $('state').textContent = JSON.stringify(s) + '\n\n/shot/info\n' + JSON.stringify(info, null, 1);
  } catch (e) { $('state').textContent = 'サーバーに届きません'; }
}
for (const k of ['camera', 'light_board', 'slow']) {
  $(k).onchange = async () => { await call('POST', `/_mock/state?${k}=${$(k).checked ? 1 : 0}`); refresh(); };
}
$('unplugged').onchange = async () => {
  await call('POST', `/_mock/unplug?on=${$('unplugged').checked ? 1 : 0}`); refresh();
};
$('btn').onclick = async () => {
  const r = await call('POST', '/_mock/button');
  $('msg').textContent = `${r.status} ${JSON.stringify(r.j)}`; refresh();
};
$('reboot').onclick = async () => {
  await call('POST', '/_mock/reboot');
  $('msg').textContent = '再起動中（約 3 秒、その間は 503）'; refresh();
};
refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
