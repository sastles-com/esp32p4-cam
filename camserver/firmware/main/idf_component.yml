dependencies:
  idf: ">=5.4"
  espressif/esp_video: "~2.5.0"
  # IDF 5.4.0 の optional_requires が名前空間付き名を解決できず esp_video から esp_ipa が公開されないため、直接依存する
  espressif/esp_ipa: "2.4.*"
  # config.json の保存先 (storage パーティションを /cfg にマウント)
  joltwallet/littlefs: "^1.14"
  # IMX708 ドライバは隣のリポジトリの作業コピーを使う
  mushbraindave/esp_cam_sensor_imx:
    version: "^0.4.0"
    override_path: "../../../../esp32-p4-imx-camera/components/esp_cam_sensor_imx"
